notes: >
  The 20%-by-end-2027 company claim is creator supplied and intentionally kept
  in the working script, but the production file must retain a visible NEEDS
  CREATOR VALIDATION hold until Sagar approves the final source. The Amazon
  observation is Sagar's first-hand experience and must stay scoped to the
  people and wave he personally observed. Computer Vision and NLP remain active
  fields; the claim is that foundation models reduce the need for a separate
  narrow model and pipeline for many routine tasks.

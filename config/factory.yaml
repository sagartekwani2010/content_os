# Script factory (content_os/factory): ideation + scripting that runs unattended so the creator only sees
# finished options. Policy (19 Nov 2026): creator time is the scarce resource; use Fable 5.2 aggressively.
# Two model families on purpose: a judge from a different family than the writer reduces self-preference
# (the Fable 5.2 system card reports Fable as the least self-critical model).
#
# provider: claude  -> local `claude -p` on the creator's Claude Code login (uses the weekly allowance)
# provider: openai  -> Responses API, key from macOS Keychain service content_os_openai (never in a file)

roles:
  taste_miner:   {provider: claude, model: claude-fable-5-2, effort: high}
  writer:        {provider: claude, model: claude-fable-5-2, effort: high}
  writer_alt:    {provider: openai, model: gpt-6.2-astra, effort: high}   # diversity: a different family drafts too
  checker:       {provider: claude, model: claude-opus-5-5, effort: high} # facts, honesty, house rules
  panel:         {provider: openai, model: gpt-6.2-astra, effort: high}   # 16-persona engagement panel
  critic:        {provider: claude, model: claude-fable-5-2, effort: high} # predicts the creator's verdict
  reviser:       {provider: claude, model: claude-fable-5-2, effort: high}
  decider:       {provider: claude, model: claude-fable-5-2, effort: high} # final decision list for the creator

tournament:
  # Angles for the first round. Each variant gets one; writer_alt variants are drafted by GPT-6.2 Astra.
  variants:
    - {id: A, role: writer,     angle: "personal test: show my measured result first, then how it works"}
    - {id: B, role: writer,     angle: "contrarian self-correction: what I believed vs what the data showed"}
    - {id: C, role: writer,     angle: "fear -> relief: the risk in plain words, then the fix"}
    - {id: D, role: writer,     angle: "curiosity gap: an odd visual or number in second 1, explained by the end"}
    - {id: E, role: writer_alt, angle: "surprise number: the single most surprising measured number as the hook"}
    - {id: F, role: writer_alt, angle: "cold-open scene: drop the viewer into the moment, no setup"}
  keep_top: 2          # variants carried into revision rounds
  max_revisions: 2     # revision rounds after round 0
  min_gain: 0.2        # stop revising a variant when its score gains less than this
  weights: {panel: 0.5, critic: 0.5}
  must_fix_penalty: 0.3   # per checker must-fix item
  max_penalty: 2.0
  workers: 8
  timeout_seconds: 1200

# Model and prompt-version configuration.
# No model name is hardcoded anywhere in the codebase. Changing a model or a
# prompt version is a config edit, and both are recorded with every artifact so
# we can tell whether a better result came from a better topic, a better prompt,
# or a better model.

defaults:
  model: gpt-5.6-terra
  reasoning_effort: medium
  verbosity: medium
  max_turns: 12
  # Retry a structured-output failure once with the validation error fed back.
  structured_output_retries: 1

agents:
  # terra handles the high-volume, judgement-light work; sol handles the work
  # where output quality is the product. Reasoning effort is set per agent
  # rather than globally, so the expensive thinking is spent where it matters.

  trend_scout:
    model: gpt-5.6-terra
    prompt_version: trend_scout_v1
    reasoning_effort: low
    verbosity: low

  scorer:
    # Highest-volume agent: one call per topic, so it runs on terra.
    model: gpt-5.6-terra
    prompt_version: scorer_v1
    reasoning_effort: medium
    verbosity: low

  strategist:
    # The hardest judgement call in the system: portfolio balance under
    # competing constraints.
    model: gpt-5.6-sol
    prompt_version: strategist_v1
    reasoning_effort: medium
    verbosity: medium

  reel_writer:
    model: gpt-5.6-sol
    prompt_version: reel_writer_v1
    reasoning_effort: medium
    verbosity: medium

  carousel_writer:
    model: gpt-5.6-sol
    prompt_version: carousel_writer_v1
    reasoning_effort: medium
    verbosity: medium

  qa:
    # QA must be sceptical and consistent rather than creative.
    model: gpt-5.6-sol
    prompt_version: qa_v1
    reasoning_effort: high
    verbosity: low

  performance_analyst:
    model: gpt-5.6-sol
    prompt_version: performance_analyst_v1
    reasoning_effort: high
    verbosity: medium

  normalizer:
    # Semantic dedup, tagging and canonicalisation. Runs only on the residue the
    # deterministic slug match cannot settle, so it is high-volume but shallow.
    model: gpt-5.6-luna
    prompt_version: normalizer_v1
    reasoning_effort: low
    verbosity: low

# Cost estimation, USD per million tokens, used by the agent_runs ledger.
# Historical rows keep the cost computed at the time, so changing these numbers
# never rewrites past spend.
#
# Four rate classes. Cached input is prompt content served from the cache.
# Cache writes are billed separately at 1.25x the uncached input price; when
# cache_write_per_mtok is omitted it is derived from input_per_mtok using
# cache_write_multiplier below.
pricing_defaults:
  cache_write_multiplier: 1.25

pricing:
  gpt-5.6-sol:
    input_per_mtok: 4.00
    cached_input_per_mtok: 0.40
    output_per_mtok: 20.00

  gpt-5.6-terra:
    input_per_mtok: 2.00
    cached_input_per_mtok: 0.20
    output_per_mtok: 12.00

  gpt-5.6-luna:
    input_per_mtok: 0.20
    cached_input_per_mtok: 0.02
    output_per_mtok: 1.20

  gpt-5:
    input_per_mtok: 1.25
    cached_input_per_mtok: 0.125
    output_per_mtok: 10.00
  gpt-5-mini:
    input_per_mtok: 0.25
    cached_input_per_mtok: 0.025
    output_per_mtok: 2.00
  gpt-5-nano:
    input_per_mtok: 0.05
    cached_input_per_mtok: 0.005
    output_per_mtok: 0.40

tracing:
  enabled: true
  # Workflow names surfaced in the OpenAI traces dashboard.
  workflows:
    discover: trend_discovery
    score: topic_scoring
    plan: weekly_content_planning
    reel: reel_generation
    carousel: carousel_generation
    qa: content_qa
    analyze: performance_analysis

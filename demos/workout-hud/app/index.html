<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workout HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a 9:16 cockpit (450 x 800 design px, scaled to the window).
   Three instrument tiles that change with the section, one full-bleed hero where the data sits
   on the thing it measures, one line of verdict under it, tabs at the bottom. */
:root{
  color-scheme: dark;
  --void:#05080D;      /* page */
  --panel:#0C141E;     /* tiles and cards */
  --line:#223A52;      /* panel edges, hairlines */
  --text:#F2F7FA;      /* primary text */
  --dim:#8CA0B3;       /* secondary text */
  --hud:#56DDF2;       /* measurements */
  --alert:#FFB23E;     /* needs my decision, nothing else */
  --ok:#79E2A0;        /* on target, approved, trending up */
  --bad:#FF7B6E;       /* trending down */
  --num:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cut:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.3;overflow:hidden;
  background-image:radial-gradient(ellipse at 50% 20%,rgba(34,58,82,.35),transparent 70%)}
.stage{position:relative;width:450px;height:800px;margin:0 auto;padding:8px 0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.pad{padding:0 14px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--alert);outline-offset:2px}

/* chamfered panel with a 1px edge and lit corner cuts */
.frame{position:relative;isolation:isolate;background:var(--line);clip-path:var(--cut)}
.frame::before{content:"";position:absolute;inset:1px;z-index:-1;background:linear-gradient(180deg,#0F1A27,#09111A);clip-path:var(--cut)}
.frame::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(135deg,var(--edge,var(--hud)) 0 11px,transparent 11px) left top/26px 26px no-repeat,linear-gradient(315deg,var(--edge,var(--hud)) 0 11px,transparent 11px) right bottom/26px 26px no-repeat}
.frame.warn{background:var(--alert);--edge:var(--alert)}
.frame.good{background:var(--ok);--edge:var(--ok)}

/* header */
header{height:30px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--num);font-weight:700;font-size:17px;letter-spacing:.12em;color:var(--hud);text-shadow:0 0 14px rgba(86,221,242,.6);line-height:1}
.meta{font-size:12px;color:var(--dim);line-height:1.1;white-space:nowrap}
.meta b{font-weight:500;color:var(--alert)} .meta b.real{color:var(--ok)}
.ctl{display:flex;gap:6px;align-items:center}
.run{border:1px solid var(--hud);background:rgba(86,221,242,.1);color:var(--hud);height:26px;padding:0 9px;font-family:var(--num);font-weight:700;font-size:14px;letter-spacing:.06em}
.days{display:flex;border:1px solid var(--line);height:26px}
.days button{background:transparent;border:0;padding:0 9px;font-family:var(--num);font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--dim)}
.days button[aria-pressed="true"]{background:var(--hud);color:#04222B}

/* instrument tiles */
.tiles{height:66px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{padding:6px 10px 5px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.tile .tl{font-size:12px;color:var(--dim);line-height:1}
.tile strong{font-family:var(--num);font-weight:700;font-size:28px;line-height:.95;letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 0 16px rgba(86,221,242,.3)}
.tile strong.long{font-size:21px;line-height:1.25}
.tile strong em{font-style:normal;font-family:var(--body);font-weight:500;font-size:12px;color:var(--dim);margin-left:3px;text-shadow:none;letter-spacing:0}
.tile .ts{font-size:12px;color:var(--dim);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.warn strong{color:var(--alert);text-shadow:0 0 16px rgba(255,178,62,.35)} .tile.warn .ts{color:var(--alert)}
.tile.good .ts{color:var(--ok)}
.tile.flip{animation:flip .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes flip{from{opacity:0;transform:translateY(-8px) scaleY(.7)}to{opacity:1;transform:none}}

/* scenes */
.scenes{flex:1;min-height:0;position:relative}
.scene{position:absolute;inset:0;display:none;flex-direction:column;gap:8px}
.scene.on{display:flex}
.scene.wipe .hero{animation:wipe .36s cubic-bezier(.2,.8,.2,1)}
@keyframes wipe{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.hero{position:relative;height:492px;flex:none;overflow:hidden;background:#04070B;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hero>canvas,.hero>video,.hero>img,.hero>svg.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero>video,.hero>img{object-fit:cover}
.under{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px}

/* meals */
.pills{position:absolute;z-index:3;left:14px;right:14px;top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pills button{background:rgba(5,8,13,.72);border:1px solid var(--line);padding:5px 8px;text-align:left;display:grid;gap:1px;backdrop-filter:blur(6px)}
.pills b{font-family:var(--num);font-weight:700;font-size:16px;letter-spacing:.04em;color:var(--dim);line-height:1}
.pills span{font-size:12px;color:var(--dim);line-height:1.1}
.pills button[aria-pressed="true"]{border-color:var(--hud);background:rgba(8,30,40,.8)} .pills button[aria-pressed="true"] b{color:var(--text)}
.pills button.scanned span{color:var(--hud)}
.scanbar{position:absolute;left:0;right:0;top:0;height:20%;transform:translateY(-100%);pointer-events:none;opacity:0;z-index:2;
  background:linear-gradient(180deg,transparent,rgba(86,221,242,.18) 80%,rgba(86,221,242,.95) 99%,#fff)}
.box{position:absolute;z-index:1;border:1px solid rgba(86,221,242,.4);
  background:
   linear-gradient(var(--hud),var(--hud)) left top/16px 2px no-repeat,linear-gradient(var(--hud),var(--hud)) left top/2px 16px no-repeat,
   linear-gradient(var(--hud),var(--hud)) right top/16px 2px no-repeat,linear-gradient(var(--hud),var(--hud)) right top/2px 16px no-repeat,
   linear-gradient(var(--hud),var(--hud)) left bottom/16px 2px no-repeat,linear-gradient(var(--hud),var(--hud)) left bottom/2px 16px no-repeat,
   linear-gradient(var(--hud),var(--hud)) right bottom/16px 2px no-repeat,linear-gradient(var(--hud),var(--hud)) right bottom/2px 16px no-repeat,
   rgba(86,221,242,.05);
  box-shadow:0 0 18px rgba(86,221,242,.28)}
.box span{position:absolute;left:-1px;top:-1px;transform:translateY(-100%);background:var(--hud);color:#04222B;font-family:var(--num);font-weight:700;font-size:15px;line-height:1.15;padding:1px 6px;white-space:nowrap}
.box span i{font-style:normal;font-weight:600;opacity:.75;margin-left:5px}
.box.off{opacity:0}
.box.lock{animation:lock .42s cubic-bezier(.2,.9,.2,1)}
@keyframes lock{0%{opacity:0;transform:scale(1.4)}60%{opacity:1;transform:scale(.97)}100%{transform:none}}
.cap{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:26px 14px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:linear-gradient(180deg,transparent,rgba(4,7,11,.92) 60%)}
.cap b{font-family:var(--num);font-weight:700;font-size:22px;line-height:1}
.cap span{font-family:var(--num);font-weight:600;font-size:17px;color:var(--hud);white-space:nowrap}
.standin{position:absolute;z-index:3;left:14px;bottom:46px;font-size:12px;color:var(--dim)}
.card{padding:9px 12px;display:grid;gap:3px}
.card .k{font-size:12px;color:var(--dim);line-height:1}
.card.warn .k{color:var(--alert)} .card.good .k{color:var(--ok)}
.card p{margin:0;font-size:15px;font-weight:500;line-height:1.25}
.card .why{font-size:12px;color:var(--dim);line-height:1.2}

/* exercise */
.verdicts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.verdict{padding:9px 12px;display:grid;gap:2px;align-content:start}
.verdict .k{font-size:12px;color:var(--dim);line-height:1}
.verdict strong{font-family:var(--num);font-weight:700;font-size:22px;line-height:1;letter-spacing:.01em}
.verdict.warn strong{color:var(--alert)} .verdict.good strong{color:var(--ok)}
.verdict .why{font-size:12px;color:var(--dim);line-height:1.2}

/* score */
.trend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px}
.tcell{display:grid;grid-template-columns:1fr auto;gap:0 6px;align-items:center;border-top:1px solid var(--line);padding-top:4px}
.tcell b{font-family:var(--num);font-weight:600;font-size:16px;line-height:1}
.tcell svg{grid-column:1/-1;width:100%;height:22px;display:block;overflow:visible}
.tcell polyline{fill:none;stroke:var(--hud);stroke-width:1.8;stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset .9s ease-out}
.tcell.off polyline{stroke-dashoffset:1;transition:none}
.tcell.low polyline{stroke:var(--alert)} .tcell.low b{color:var(--alert)}
.delta{font-family:var(--num);font-weight:700;font-size:15px;white-space:nowrap}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)} .delta.flat{color:var(--dim)}
.note{font-size:12px;color:var(--dim);margin:0;line-height:1.25}

/* why */
.why-hero{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.chipsel{display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:5}
.chipsel button{background:rgba(9,17,26,.9);border:1px solid var(--line);padding:4px 10px;font-family:var(--num);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--dim)}
.chipsel button[aria-pressed="true"]{border-color:var(--hud);color:var(--hud);box-shadow:0 0 12px rgba(86,221,242,.3)}
.graph{position:relative;flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto auto auto;align-content:space-between;gap:0 8px}
.graph svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.graph path{fill:none;stroke:var(--hud);stroke-width:1.6;opacity:.85;stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset .7s ease-out}
.graph path.hide{stroke-dashoffset:1;transition:none}
.graph path.amber{stroke:var(--alert)}
.graph circle{fill:#fff;filter:drop-shadow(0 0 5px var(--hud))}
.node{position:relative;z-index:1;border:1px solid var(--line);background:rgba(9,17,26,.97);padding:8px 9px;display:flex;flex-direction:column;gap:3px;min-width:0}
.node .k{font-size:12px;color:var(--hud);line-height:1}
.node b{font-weight:500;font-size:14px;line-height:1.2}
.node.wide{grid-column:1/-1}
.node.wide b{font-size:15px}
.node.route{border-color:var(--alert);box-shadow:0 0 26px rgba(255,178,62,.22);align-items:center;text-align:center;padding:10px}
.node.route .k{color:var(--alert)}
.routes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.routes span{font-family:var(--num);font-weight:700;font-size:17px;letter-spacing:.04em;padding:3px 9px;border:1px solid var(--line);color:var(--dim)}
.routes span.pick{border-color:var(--alert);background:var(--alert);color:#1B1300;box-shadow:0 0 20px rgba(255,178,62,.55)}
.routes span.scan{border-color:var(--hud);color:var(--hud)}
.node.gate{border-style:dashed;align-items:center;text-align:center}
.node.off{opacity:0}
.node.in{animation:pop .4s ease-out}

/* plan */
.plan-hero{padding:14px;display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.block{display:grid;gap:5px}
.bh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:3px}
.bh b{font-family:var(--num);font-weight:700;font-size:18px;letter-spacing:.03em;line-height:1}
.bh span{font-size:12px;color:var(--dim)}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:baseline;font-size:14px}
.prow b{font-weight:500}
.prow .last{font-family:var(--num);font-weight:500;font-size:15px;color:var(--dim);white-space:nowrap}
.prow .next{font-family:var(--num);font-weight:700;font-size:17px;white-space:nowrap;min-width:118px;text-align:right}
.tag{font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.04em;padding:0 5px;border:1px solid var(--line);color:var(--dim);margin-left:5px;vertical-align:2px}
.tag.PROGRESS,.tag.ADD{border-color:var(--ok);color:var(--ok)} .tag.HOLD{border-color:var(--alert);color:var(--alert)}
.mrow{display:grid;grid-template-columns:72px 1fr;gap:8px;font-size:14px;align-items:baseline}
.mrow .k{font-size:12px;color:var(--dim)}
.mrow del{display:block;color:var(--dim);font-size:12px}
.mrow ins{text-decoration:none;color:var(--alert);font-weight:500}
.mrow.pre del{text-decoration:none;color:var(--text);font-size:14px} .mrow.pre ins{display:none}
.kcal{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kcal strong{font-family:var(--num);font-weight:700;font-size:40px;line-height:.95;font-variant-numeric:tabular-nums}
.kcal del{color:var(--dim);font-family:var(--num);font-size:20px}
.kcal.chg strong{color:var(--alert);text-shadow:0 0 18px rgba(255,178,62,.35)}
.kcal p{margin:0;flex-basis:100%;font-size:12px;color:var(--dim);line-height:1.25}
.gate2{display:grid;grid-template-columns:1fr auto;gap:8px}
.gate2 button{border:1px solid var(--line);background:rgba(9,17,26,.92);height:46px;padding:0 16px;font-family:var(--num);font-weight:700;letter-spacing:.06em;font-size:20px}
.gate2 .yes{border-color:var(--alert);background:var(--alert);color:#1B1300;box-shadow:0 0 24px rgba(255,178,62,.4)}
.gate2 .yes.done{background:var(--ok);border-color:var(--ok);box-shadow:0 0 24px rgba(121,226,160,.45)}
.gate2[hidden]{display:none}
.status{font-size:13px;color:var(--dim);margin:0;line-height:1.2}
.status.ok{color:var(--ok)} .status.no{color:var(--alert)}

/* bottom tabs */
nav{height:44px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
nav button{background:transparent;border:0;border-top:2px solid var(--line);font-family:var(--num);font-weight:700;font-size:16px;letter-spacing:.05em;color:var(--dim);padding:0}
nav button[aria-current="true"]{border-top-color:var(--hud);color:var(--text);background:linear-gradient(180deg,rgba(86,221,242,.16),transparent 70%)}
nav button.done{border-top-color:rgba(86,221,242,.45)}

#boot{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(5,8,13,.97)}
#boot.on{display:grid;animation:bootout .3s ease-in 1.55s forwards}
@keyframes bootout{to{opacity:0}}
.bootin{display:grid;justify-items:center;gap:14px}
#boot svg{width:190px;height:190px}
#boot .r1{transform-origin:100px 100px;animation:spin 1.6s linear infinite}
#boot .r2{transform-origin:100px 100px;animation:spin 2.2s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
#boot h2{margin:0;font-family:var(--num);font-weight:700;letter-spacing:.3em;font-size:20px;color:var(--hud);text-shadow:0 0 16px var(--hud)}
#boot ul{list-style:none;margin:0;padding:0;font-size:13px;color:var(--dim);display:grid;gap:3px;min-width:210px}
#boot li{display:flex;justify-content:space-between;opacity:0;animation:pop .2s ease-out forwards}
#boot li b{color:var(--ok);font-weight:500}

@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stagger.off{opacity:0}
.stagger.in{animation:pop .35s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="boot" aria-hidden="true"><div class="bootin">
  <svg viewBox="0 0 200 200" fill="none" stroke-linecap="round">
    <polygon points="100,22 167,61 167,139 100,178 33,139 33,61" stroke="#223A52" stroke-width="2"/>
    <g class="r1" stroke="#56DDF2" stroke-width="4"><path d="M100 10 A90 90 0 0 1 178 55"/><path d="M190 100 A90 90 0 0 1 145 178"/><path d="M55 178 A90 90 0 0 1 10 100"/></g>
    <g class="r2" stroke="#FFB23E" stroke-width="2"><path d="M100 40 A60 60 0 0 1 160 100"/><path d="M100 160 A60 60 0 0 1 40 100"/></g>
    <path d="M70 100 H130 M100 70 V130" stroke="#F2F7FA" stroke-width="2"/>
  </svg>
  <h2>WORKOUT HUD</h2>
  <ul><li style="animation-delay:.15s"><span>Meal scan</span><b>ready</b></li><li style="animation-delay:.4s"><span>Exercise scan</span><b>ready</b></li><li style="animation-delay:.65s"><span>Score map</span><b>ready</b></li><li style="animation-delay:.9s"><span>Decision trace</span><b>ready</b></li><li style="animation-delay:1.15s"><span>Approval gate</span><b>armed</b></li></ul>
</div></div>

<div class="stage" id="stage">
  <header class="pad">
    <div><div class="brand">WORKOUT HUD</div><div class="meta"><span id="dateLab"></span>, <b id="badge">placeholder</b></div></div>
    <div class="ctl"><button class="run" id="run">Run</button><div class="days" id="days" role="group" aria-label="Day"><button data-d="yesterday">Yesterday</button><button data-d="today">Today</button></div></div>
  </header>

  <div class="tiles pad" id="tiles" aria-live="off">
    <div class="tile frame"><span class="tl"></span><strong><span class="tv"></span><em></em></strong><span class="ts"></span></div>
    <div class="tile frame"><span class="tl"></span><strong><span class="tv"></span><em></em></strong><span class="ts"></span></div>
    <div class="tile frame"><span class="tl"></span><strong><span class="tv"></span><em></em></strong><span class="ts"></span></div>
  </div>

  <div class="scenes">
    <section class="scene" id="sc-meals" aria-label="Meals">
      <div class="hero" id="mealHero"></div>
      <div class="under pad"><div class="frame card stagger" id="nudge"></div></div>
    </section>

    <section class="scene" id="sc-exercise" aria-label="Exercise">
      <div class="hero" id="cam"><canvas id="cv" width="900" height="984" aria-label="Pose overlay with knee angle, torso lean and lean per rep"></canvas></div>
      <div class="under pad"><div class="verdicts"><div class="frame verdict stagger" id="vPost"></div><div class="frame verdict stagger" id="vNext"></div></div></div>
    </section>

    <section class="scene" id="sc-score" aria-label="Score">
      <div class="hero"><canvas id="holo" width="900" height="984" aria-label="Rotating body map with a weekly score and change for each body part"></canvas></div>
      <div class="under pad"><div class="trend" id="trend"></div><p class="note" id="scoreNote"></p></div>
    </section>

    <section class="scene" id="sc-why" aria-label="Why">
      <div class="hero why-hero"><div class="chipsel" id="decs" role="group" aria-label="Decision"></div><div class="graph" id="graph"></div></div>
      <div class="under pad"><div class="frame card stagger" id="reason"></div></div>
    </section>

    <section class="scene" id="sc-plan" aria-label="Plan">
      <div class="hero plan-hero"><div class="block" id="pWork"></div><div class="block" id="pMeals"></div><div class="block" id="pKcal"></div></div>
      <div class="under pad"><div class="gate2" id="gate"><button class="yes" id="approve">Approve plan</button><button id="reject">Reject</button></div><p class="status" id="status"></p><p class="note" id="ledger"></p></div>
    </section>
  </div>

  <nav class="pad" id="nav" aria-label="Sections">
    <button data-s="meals">Meals</button><button data-s="exercise">Exercise</button><button data-s="score">Score</button><button data-s="why">Why</button><button data-s="plan">Plan</button>
  </nav>
</div>

<script src="day.js"></script>
<script>
(function(){
"use strict";
var H=window.HUD, T=H.targets, $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
var REDUCED=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var HUD="#56DDF2", ALERT="#FFB23E", DIM="#8CA0B3", TEXT="#F2F7FA", LINE="#223A52", OK="#79E2A0", BAD="#FF7B6E";
var NUMF="Saira Condensed, Arial Narrow, sans-serif", BODYF="Saira, system-ui, sans-serif";
var nf=function(n){return Math.round(n).toLocaleString("en-IN");};
var timers=[], rafs={}, gen=0;
function after(ms,fn){ timers.push(setTimeout(fn,ms)); }
function clearAll(){ gen++; timers.forEach(clearTimeout); timers=[]; Object.keys(rafs).forEach(function(k){cancelAnimationFrame(rafs[k]);}); rafs={}; }
function tween(from,to,ms,cb){ if(REDUCED||ms<=0){cb(to);return;} var t0=performance.now(), g=gen; (function tick(n){ if(g!==gen) return; var p=Math.min(1,(n-t0)/ms), e=1-Math.pow(1-p,3); cb(from+(to-from)*e); if(p<1) requestAnimationFrame(tick); })(t0); }

$("reject").addEventListener("click",function(){ approvals[dayKey]={ok:false,at:stamp()}; planRest(); });

/* ================= sections, days, full run ================= */
var SCN={meals:[mealsRest,mealsPlay],exercise:[exRest,exPlay],score:[scoreRest,scorePlay],why:[whyRest,whyPlay],plan:[planRest,planPlay]}, order=["meals","exercise","score","why","plan"];
function fit(){ $("stage").style.zoom=Math.max(.4,Math.min(innerWidth/450,innerHeight/800)); }
function show(id,play){ if(!SCN[id]) id="meals"; var changed=id!==cur; clearAll(); cur=id;
  order.forEach(function(s){ var el=$("sc-"+s); el.classList.toggle("on",s===id); el.classList.remove("wipe"); });
  [].forEach.call($("nav").children,function(b){ b.setAttribute("aria-current",b.dataset.s===id?"true":"false"); b.classList.toggle("done",order.indexOf(b.dataset.s)<order.indexOf(id)); });
  SCN[id][0](); if(id==="why") layoutEdges();
  if((changed||play)&&!REDUCED) TL.forEach(function(el,i){ el.classList.remove("flip"); void el.offsetWidth; el.style.animationDelay=(i*70)+"ms"; el.classList.add("flip"); });
  if(play&&!REDUCED){ void $("sc-"+id).offsetWidth; $("sc-"+id).classList.add("wipe"); SCN[id][1](); }
  if(location.hash.slice(1)!==id){ try{history.replaceState(null,"","#"+id);}catch(e){} } }
function setDay(k,play){ dayKey=k; D=H.days[k]; mealIdx=Math.min(1,D.meals.length-1); $("dateLab").textContent=D.date;
  [].forEach.call($("days").children,function(b){ b.setAttribute("aria-pressed",b.dataset.d===k?"true":"false"); }); show(cur||"meals",play); }
$("days").addEventListener("click",function(e){ var b=e.target.closest("button"); if(b){ stopRun(); setDay(b.dataset.d,true); } });
$("nav").addEventListener("click",function(e){ var b=e.target.closest("button"); if(b){ stopRun(); show(b.dataset.s,true); } });
$("mealHero").addEventListener("click",function(e){ var b=e.target.closest(".pills button"); if(b){ stopRun(); clearAll(); unhide($("nudge")); var t=totals(D.meals.length); intake(t.p,t.k,true); selectMeal(+b.dataset.i,true); } });
$("decs").addEventListener("click",function(e){ var b=e.target.closest("button"); if(b){ stopRun(); clearAll(); decKey=b.dataset.k; whyPlay(); } });
addEventListener("hashchange",function(){ var h=location.hash.slice(1); if(h&&h!==cur) show(h,false); });
addEventListener("resize",function(){ fit(); if(cur==="why") layoutEdges(); });
document.addEventListener("keydown",function(e){ var i=order.indexOf(cur); if(e.key==="ArrowRight"&&i<order.length-1){stopRun();show(order[i+1],true);} if(e.key==="ArrowLeft"&&i>0){stopRun();show(order[i-1],true);} });
var runT=[]; function stopRun(){ runT.forEach(clearTimeout); runT=[]; $("boot").classList.remove("on"); }
$("run").addEventListener("click",function(){ stopRun(); if(dayKey!=="today"){ dayKey="today"; D=H.days.today; $("dateLab").textContent=D.date; [].forEach.call($("days").children,function(b){ b.setAttribute("aria-pressed",b.dataset.d==="today"?"true":"false"); }); }
  decKey="set"; var at=REDUCED?0:1850, hold={meals:8300,exercise:8200,score:5600,why:7800,plan:0};
  if(!REDUCED){ var b=$("boot"); void b.offsetWidth; b.classList.add("on"); runT.push(setTimeout(function(){b.classList.remove("on");},1900)); }
  order.forEach(function(s){ runT.push(setTimeout(function(){show(s,true);},at)); at+=hold[s]; }); });
fit(); cur=SCN[location.hash.slice(1)]?location.hash.slice(1):"meals"; setDay("today",false);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ SCN[cur][0](); if(cur==="why") layoutEdges(); });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo vs Production — Illustrative experiment</title>
  <style>
    :root {
      --ink: #080d18;
      --panel: #111a2c;
      --line: #26334c;
      --muted: #aebbd0;
      --copy: #f3f6fb;
      --cyan: #69e6ff;
      --good: #5fe0a1;
      --bad: #ff7575;
      --amber: #ffc85c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      color: var(--copy); font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: radial-gradient(circle at 20% 0%, #17284a 0, var(--ink) 48%);
    }
    .phone {
      width: min(100vw, 720px); min-height: 100vh; padding: 34px 28px 30px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .eyebrow { color: var(--cyan); font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 4px 0 0; font-size: clamp(30px, 6vw, 50px); letter-spacing: -.045em; line-height: 1.04; }
    .note { margin: 0; color: var(--muted); line-height: 1.45; font-size: 16px; }
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    button {
      appearance: none; border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 8px; font: inherit; font-size: 13px; font-weight: 750;
      color: var(--muted); background: #0d1525; cursor: pointer;
    }
    button[aria-pressed="true"] { color: var(--ink); background: var(--cyan); border-color: var(--cyan); }
    .case, .outcome { border: 1px solid var(--line); border-radius: 20px; padding: 18px; background: rgba(17,26,44,.88); }
    .case-label { color: var(--muted); font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .request { margin: 9px 0 0; font-size: 23px; font-weight: 730; letter-spacing: -.025em; }
    .trace { position: relative; display: grid; gap: 0; }
    .step { position: relative; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; min-height: 83px; }
    .step:not(:last-child)::before { content: ""; position: absolute; left: 14px; top: 29px; width: 2px; height: 55px; background: var(--line); }
    .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #1d2a43; border: 1px solid #3a4d70; font-size: 14px; }
    .step-content { padding: 2px 0; }
    .step-title { font-weight: 780; font-size: 16px; }
    .step-detail { margin-top: 5px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.35; }
    .success .dot { color: var(--good); border-color: var(--good); }
    .failure .dot { color: var(--bad); border-color: var(--bad); }
    .guardrail .dot { color: var(--amber); border-color: var(--amber); }
    .outcome { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    .outcome strong { display: block; font-size: 20px; letter-spacing: -.02em; }
    .outcome span { color: var(--muted); font-size: 14px; line-height: 1.35; }
    .badge { border-radius: 999px; padding: 8px 11px; white-space: nowrap; font-size: 12px; font-weight: 850; }
    .pass { background: rgba(95,224,161,.16); color: var(--good); }
    .fail { background: rgba(255,117,117,.16); color: var(--bad); }
    .safe { background: rgba(255,200,92,.16); color: var(--amber); }
    footer { margin-top: auto; color: #71809b; font-size: 12px; }
  </style>
</head>
<body>
  <main class="phone">
    <div>
      <div class="eyebrow">Illustrative experiment · Support assistant</div>
      <h1 id="headline">A demo only proves the happy path.</h1>
      <p class="note" id="subline">Same customer request. Change one condition.</p>
    </div>

    <div class="controls" aria-label="Experiment condition">
      <button type="button" data-testid="happy-path" aria-pressed="true">1. Happy path</button>
      <button type="button" data-testid="tool-failure" aria-pressed="false">2. Tool fails</button>
      <button type="button" data-testid="guardrail" aria-pressed="false">3. Guardrail</button>
    </div>

    <section class="case">
      <div class="case-label">Customer request</div>
      <p class="request">“Where is my order?”</p>
    </section>

    <section class="trace" id="trace" aria-live="polite"></section>

    <section class="outcome">
      <div><strong id="outcome-title"></strong><span id="outcome-detail"></span></div>
      <div id="badge" class="badge"></div>
    </section>
    <footer>Fictional system and simulated outcomes. Built for the carousel experiment.</footer>
  </main>
  <script>
    const states = {
      happy: {
        headline: "A demo only proves the happy path.",
        subline: "The tool works. The assistant looks impressive.",
        steps: [
          ["agent", "Support agent", "decides it needs the order status"],
          ["tool", "get_order(order_1842)", "status: delayed · ETA: 8 min"],
          ["success", "Response", "‘Your order is on its way.’"]
        ], outcome: ["The demo passes", "But nothing unexpected happened.", "PASS", "pass"]
      },
      failure: {
        headline: "Now change one thing: the tool times out.",
        subline: "Same request. Same agent. The happy-path demo is gone.",
        steps: [
          ["agent", "Support agent", "decides it needs the order status"],
          ["failure", "get_order(order_1842)", "timeout after 3s"],
          ["failure", "Response", "‘I can’t help with that right now.’"]
        ], outcome: ["The customer is stranded", "A fluent answer did not make the system reliable.", "FAIL", "fail"]
      },
      guardrail: {
        headline: "Production adds a safe next step.",
        subline: "The failure is expected, observed and handled.",
        steps: [
          ["agent", "Support agent", "requests the current order status"],
          ["failure", "get_order(order_1842)", "timeout after 3s"],
          ["guardrail", "Workflow fallback", "retry once → preserve case state → human escalation"],
          ["success", "Response", "‘I’ve handed this to support and kept your order context.’"]
        ], outcome: ["The outcome is protected", "That is the difference between a demo and a system.", "GUARDED", "safe"]
      }
    };
    const symbols = { agent: "✦", tool: "↗", success: "✓", failure: "!", guardrail: "◇" };
    function render(key) {
      const state = states[key];
      document.getElementById("headline").textContent = state.headline;
      document.getElementById("subline").textContent = state.subline;
      document.getElementById("trace").innerHTML = state.steps.map(([kind, title, detail]) => `
        <div class="step ${kind}"><div class="dot">${symbols[kind]}</div><div class="step-content"><div class="step-title">${title}</div><div class="step-detail">${detail}</div></div></div>`).join("");
      document.getElementById("outcome-title").textContent = state.outcome[0];
      document.getElementById("outcome-detail").textContent = state.outcome[1];
      const badge = document.getElementById("badge"); badge.textContent = state.outcome[2]; badge.className = `badge ${state.outcome[3]}`;
      document.querySelectorAll("button").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.testid === ({happy:"happy-path", failure:"tool-failure", guardrail:"guardrail"}[key]))));
    }
    document.querySelector("[data-testid='happy-path']").onclick = () => render("happy");
    document.querySelector("[data-testid='tool-failure']").onclick = () => render("failure");
    document.querySelector("[data-testid='guardrail']").onclick = () => render("guardrail");
    render("happy");
  </script>
</body>
</html>
